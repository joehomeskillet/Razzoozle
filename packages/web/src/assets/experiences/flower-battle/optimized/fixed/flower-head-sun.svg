<!--
  flower-head-sun.svg  sun blossom (petals + face only).
  IDs: flower-petals, flower-face
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 80 80" aria-hidden="true">
  <g id="flower-petals">
    <ellipse cx="0" cy="-18" rx="6" ry="14" fill="currentColor" />
    <ellipse cx="0" cy="18" rx="6" ry="14" fill="currentColor" />
    <ellipse cx="-18" cy="0" rx="14" ry="6" fill="currentColor" />
    <ellipse cx="18" cy="0" rx="14" ry="6" fill="currentColor" />
    <ellipse cx="-13" cy="-13" rx="6" ry="12" fill="currentColor" transform="rotate(-45)" />
    <ellipse cx="13" cy="-13" rx="6" ry="12" fill="currentColor" transform="rotate(45)" />
    <ellipse cx="-13" cy="13" rx="6" ry="12" fill="currentColor" transform="rotate(45)" />
    <ellipse cx="13" cy="13" rx="6" ry="12" fill="currentColor" transform="rotate(-45)" />
    <circle cx="0" cy="0" r="12" fill="var(--status-pending-bg)" />
  </g>
  <g id="flower-face">
    <circle cx="-4" cy="-1" r="2" fill="var(--status-online-text)" />
    <circle cx="4" cy="-1" r="2" fill="var(--status-online-text)" />
    <path d="M-6 6 Q0 10 6 6" fill="none" stroke="var(--status-online-text)" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
