<!--
  plant-pot-01.svg — simple terracotta pot + soil lip under the plant.
  Self-generated Razzoozle-internal CC0. Foot at bottom centre.
  fill (currentColor) = pot body; accent = soil lip; ink = outline.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100" aria-hidden="true">
  <g id="plant-pot">
    <!-- pot body -->
    <path
      d="M36 28 L44 88 Q80 96 116 88 L124 28 Z"
      fill="currentColor"
      stroke="var(--flower-battle-ink, currentColor)"
      stroke-width="2.5"
      stroke-linejoin="round"
      opacity="0.95"
    />
    <!-- rim -->
    <ellipse
      cx="80"
      cy="28"
      rx="50"
      ry="12"
      fill="currentColor"
      stroke="var(--flower-battle-ink, currentColor)"
      stroke-width="2.5"
    />
    <!-- soil surface -->
    <ellipse
      cx="80"
      cy="28"
      rx="40"
      ry="8"
      fill="var(--flower-battle-soil, currentColor)"
      opacity="0.85"
    />
    <!-- soil highlight -->
    <ellipse cx="80" cy="26" rx="22" ry="3.5" fill="currentColor" opacity="0.2" />
  </g>
</svg>
