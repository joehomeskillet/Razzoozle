    <ellipse cx="60" cy="92" rx="40" ry="36" opacity="0.9" />
    <ellipse cx="140" cy="92" rx="40" ry="36" opacity="0.9" />
    <ellipse cx="100" cy="76" rx="44" ry="34" opacity="1" />
