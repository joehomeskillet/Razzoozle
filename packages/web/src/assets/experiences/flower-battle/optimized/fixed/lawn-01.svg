<!--
  lawn-01.svg  - cartoon lawn strip (foreground grass plane).
  Self-generated, Razzoozle-internal CC0.
  Dimensions: 1920x600. Solid fill + texture overlay of darker grass strokes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="lawn-01-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.85" />
      <stop offset="100%" stop-color="currentColor" stop-opacity="1" />
    </linearGradient>
  </defs>
  <g id="lawn-01">
    <!-- base grass fill -->
    <rect x="0" y="0" width="1920" height="600" fill="currentColor" />
    <!-- darker shadow at the very front (closer to viewer) -->
    <rect x="0" y="540" width="1920" height="60" fill="url(#lawn-01-shade)" opacity="0.6" />
    <!-- grass stroke texture (varied opacity for cartoon feel) -->
    <g stroke="var(--line)" stroke-width="2" stroke-linecap="round" opacity="0.35">
      <line x1="40" y1="80" x2="34" y2="50" />
      <line x1="120" y1="120" x2="112" y2="92" />
      <line x1="220" y1="60" x2="214" y2="34" />
      <line x1="320" y1="140" x2="310" y2="108" />
      <line x1="420" y1="90" x2="412" y2="60" />
      <line x1="540" y1="180" x2="530" y2="150" />
      <line x1="660" y1="120" x2="652" y2="90" />
      <line x1="780" y1="200" x2="770" y2="170" />
      <line x1="900" y1="140" x2="892" y2="108" />
      <line x1="1020" y1="220" x2="1012" y2="190" />
      <line x1="1140" y1="160" x2="1132" y2="130" />
      <line x1="1260" y1="240" x2="1250" y2="208" />
      <line x1="1380" y1="180" x2="1372" y2="148" />
      <line x1="1500" y1="260" x2="1490" y2="230" />
      <line x1="1620" y1="200" x2="1612" y2="170" />
      <line x1="1740" y1="280" x2="1730" y2="250" />
      <line x1="1860" y1="220" x2="1852" y2="190" />
      <!-- second pass with slight offset for density -->
      <line x1="80" y1="200" x2="72" y2="170" />
      <line x1="200" y1="240" x2="192" y2="208" />
      <line x1="340" y1="280" x2="332" y2="250" />
      <line x1="480" y1="320" x2="472" y2="290" />
      <line x1="620" y1="360" x2="612" y2="330" />
      <line x1="760" y1="400" x2="752" y2="370" />
      <line x1="900" y1="440" x2="892" y2="408" />
      <line x1="1040" y1="480" x2="1032" y2="450" />
      <line x1="1180" y1="520" x2="1172" y2="490" />
    </g>
  </g>
</svg>