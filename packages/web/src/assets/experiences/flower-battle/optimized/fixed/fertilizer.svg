<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fertilizer-title">
  <defs>
    <style>
      .fertilizer-bucket { fill: currentColor; opacity: 0.85; }
      .fertilizer-liquid { fill: currentColor; opacity: 0.95; }
      .fertilizer-spout { fill: currentColor; opacity: 0.8; }
    </style>
  </defs>
  <title id="fertilizer-title">Fertilizer Power-up</title>

  <!-- Main bucket body -->
  <g id="bucket-body">
    <!-- Trapezoid bucket (wider at top, narrower at bottom) -->
    <path class="fertilizer-bucket" d="M 16 18 L 48 18 L 44 50 L 20 50 Z"/>
    <!-- Handle arc -->
    <path class="fertilizer-bucket" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          d="M 22 18 Q 32 8 42 18"/>
  </g>

  <!-- Liquid level inside bucket -->
  <g id="liquid-level">
    <ellipse class="fertilizer-liquid" cx="32" cy="40" rx="11" ry="4"/>
    <path class="fertilizer-liquid" d="M 21 40 L 19 50 L 45 50 L 43 40 Z"/>
  </g>

  <!-- Pour stream (animated) -->
  <g id="pour-stream" opacity="0">
    <path class="fertilizer-spout" d="M 28 12 Q 26 22 25 32 Q 24.5 38 24 44"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
