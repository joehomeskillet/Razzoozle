<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="umbrella-title">
  <defs>
    <style>
      .umbrella-canopy { fill: currentColor; opacity: 0.9; }
      .umbrella-handle { stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; }
      .umbrella-droplet { fill: currentColor; opacity: 0.7; }
    </style>
  </defs>
  <title id="umbrella-title">Umbrella Shield Power-up</title>

  <!-- Umbrella canopy (semi-circle) -->
  <g id="canopy">
    <path class="umbrella-canopy" d="M 16 28 Q 16 12 32 12 Q 48 12 48 28 Z"/>
  </g>

  <!-- Umbrella handle (pole) -->
  <g id="handle">
    <line class="umbrella-handle" x1="32" y1="28" x2="32" y2="52"/>
    <!-- Handle tip hook -->
    <path class="umbrella-handle" d="M 32 52 Q 28 54 26 52"/>
  </g>

  <!-- Falling droplets (animated) -->
  <g id="droplet-1" opacity="0">
    <circle class="umbrella-droplet" cx="24" cy="38" r="2.5"/>
  </g>
  <g id="droplet-2" opacity="0">
    <circle class="umbrella-droplet" cx="32" cy="42" r="2.5"/>
  </g>
  <g id="droplet-3" opacity="0">
    <circle class="umbrella-droplet" cx="40" cy="38" r="2.5"/>
  </g>
</svg>
