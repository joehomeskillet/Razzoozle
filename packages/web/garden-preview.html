<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flower Battle Garden Preview</title>
    <link rel="stylesheet" href="/src/index.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--flower-battle-sky, #c9eaef);
      }
      #root {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #status {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 2;
        font: 12px/1.4 system-ui, sans-serif;
        color: var(--flower-battle-ink, #242236);
        background: color-mix(in srgb, var(--flower-battle-cream, #fefbf2) 88%, transparent);
        border: 1px solid color-mix(in srgb, var(--flower-battle-ink, #242236) 15%, transparent);
        border-radius: 8px;
        padding: 8px 10px;
        max-width: min(480px, 90vw);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <canvas id="garden" data-testid="garden-preview-canvas"></canvas>
      <div id="status">loading…</div>
    </div>
    <script type="module" src="/src/dev/garden-preview-main.ts"></script>
  </body>
</html>
