packages:
  - "packages/*"
  # The MCP server (@razzoozle/mcp) is a host-only dev tool (project-scoped
  # .mcp.json → node packages/mcp/dist/index.cjs, esbuild-bundled + self-
  # contained). Excluded from the main workspace so it never drifts pnpm-lock or
  # the Docker frozen install — the runtime image ships only web + socket.
  - "!packages/mcp"

# Force postcss (transitive via vite/@tailwindcss/vite) to a patched release.
# 8.5.16 is vulnerable to GHSA-r28c-9q8g-f8xx; fix is >=8.5.18. vite's own range
# (^8.5.16) already permits the fix, but pnpm keeps the locked resolution
# stable across installs — only an explicit override bumps a pure transitive
# dep. Kept in package.json's pnpm.overrides too for the CI runner (pinned to
# pnpm 9, which predates workspace-level overrides and only reads package.json).
overrides:
  postcss: ">=8.5.18"

allowBuilds:
  esbuild: true
  oxlint: true
  oxlint-tsgolint: true

minimumReleaseAge: 10080
blockExoticSubdeps: true
# Relaxed from "no-downgrade": the upstream lockfile flags react-redux@9.2.0 and
# semver@6.3.1 as trust-downgrades, which blocks a clean build of this fork.
trustPolicy: permissive
