[workspace]
members = ["protocol", "engine", "server"]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"

# Dev-profile debuginfo trim (Phase 1, docs/build-baseline.md) — build config only.
# "line-tables-only" keeps panic/backtrace file:line info but drops full DWARF,
# cutting debug compile + link time and target/ size. No behavior change.
[profile.dev]
debug = "line-tables-only"

# Release profile: Full optimization for production binaries.
# opt-level = 3: Aggressive optimizations (O3)
# lto = "thin": Fast link-time optimization (balances compile time vs size/speed)
# codegen-units = 1: Better optimization across codegen units (slower compile, better codegen)
# strip = "symbols": Strip symbol tables for smaller binary size (production backtraces will lack symbols)
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
