name: Design Tokens Automated Sync & Governance

on:
  workflow_dispatch:
  push:
    paths:
      - 'design.tokens.json'
      - 'packages/web/src/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.cursorrules'
      - '.clinerules'
      - 'CODEX.md'
      - '.windsurfrules'
  pull_request:
    paths:
      - 'design.tokens.json'
      - 'packages/web/src/**'

permissions:
  contents: read

jobs:
  tokens-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Design Tokens & Living Spec
        run: pnpm tokens:build

      - name: Run Unified Design System Gate (Auto-Fix + Validate)
        run: pnpm tokens:gate:fix

      - name: Run Workspace Verification (types + lint + tests)
        run: pnpm -r run types && oxlint && pnpm -r --if-present run test

      - name: Verify No Untracked Generated Changes
        run: |
          if ! git diff-index --quiet HEAD; then
            echo "ERROR: Generated tokens or specs have untracked changes after build & fix."
            echo "This indicates the token generation scripts are producing output that differs from the committed state."
            echo ""
            echo "Required local fix:"
            echo "  pnpm tokens:build"
            echo "  pnpm tokens:gate:fix"
            echo "  git add -A"
            echo "  git commit -m 'chore(tokens): sync generated CSS, TS types, and specs'"
            echo ""
            echo "Changes detected:"
            git diff --name-only HEAD
            exit 1
          fi
